  <script>
const META = 80000;
let records = [];
let deleteTarget = null;
let hasFile = false;

// Gerar UUID único
function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

const defaultConfig = {
  titulo: 'Controle de Entrada',
  meta_label: 'Meta: R$ 80.000,00',
  background_color: '#0f172a',
  surface_color: '#1e293b',
  text_color: '#ffffff',
  primary_color: '#34d399',
  secondary_color: '#94a3b8',
  font_family: 'DM Sans',
  font_size: 16
};

// LocalStorage e IndexedDB para persistência
const STORAGE_KEY = 'payments_data';
const DELETE_PASSWORD = '1234'; // Senha para deletar
let db;

// Inicializar IndexedDB para armazenar comprovantes
function initIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ControleEntradaDB', 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      db = req.result;
      resolve();
    };
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('comprovantes')) {
        database.createObjectStore('comprovantes', { keyPath: 'id' });
      }
    };
  });
}

function loadRecords() {
  const data = localStorage.getItem(STORAGE_KEY);
  let records = data ? JSON.parse(data) : [];
  
  // Migrar registros antigos que não têm ID
  records = records.map(r => {
    if (!r.id) {
      r.id = generateUUID();
    }
    return r;
  });
  
  // Salvar registros migrados
  if (records.length > 0) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }
  
  return records;
}

function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function saveComprovante(id, file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const transaction = db.transaction(['comprovantes'], 'readwrite');
      const store = transaction.objectStore('comprovantes');
      store.put({
        id,
        data: reader.result,
        nome: file.name,
        tipo: file.type,
        data_salva: new Date().toISOString()
      });
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

function getComprovante(id) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['comprovantes'], 'readonly');
    const store = transaction.objectStore('comprovantes');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deleteComprovante(id) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['comprovantes'], 'readwrite');
    const store = transaction.objectStore('comprovantes');
    store.delete(id);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
  });
}

function fmt(v) { 
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); 
}

function updateProgress() {
  const total = records.reduce((s, r) => s + (r.valor || 0), 0);
  const pct = Math.min((total / META) * 100, 100);
  document.getElementById('total-value').textContent = fmt(total);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-percent').textContent = Math.round(pct) + '%';
  const circ = document.getElementById('progress-circle');
  circ.style.strokeDashoffset = 213.6 - (213.6 * pct / 100);
  document.getElementById('remaining-text').textContent = total >= META ? '🎉 Meta atingida!' : `Faltam ${fmt(META - total)}`;
}

function renderRecords() {
  const list = document.getElementById('records-list');
  const empty = document.getElementById('empty-state');
  if (records.length === 0) { 
    list.innerHTML = ''; 
    empty.classList.remove('hidden'); 
    return; 
  }
  empty.classList.add('hidden');
  list.innerHTML = '';
  
  records.forEach((r, i) => {
    const el = document.createElement('div');
    el.dataset.id = r.id;
    el.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 flex items-center justify-between card-enter';
    
    const dataFormatada = r.data ? new Date(r.data).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '';
    
    el.innerHTML = `
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-white truncate">${r.descricao || 'Pagamento'}</p>
        <p class="text-xs text-slate-400 mt-0.5">${dataFormatada} ${r.tem_comprovante ? '<span class="text-emerald-400">• Comprovante</span>' : ''}</p>
      </div>
      <div class="flex items-center gap-2 ml-3">
        <span class="font-bold text-emerald-400 whitespace-nowrap">${fmt(r.valor || 0)}</span>
        ${r.tem_comprovante ? `<button class="down-btn text-blue-400 hover:text-blue-300 transition" title="Baixar comprovante"><i data-lucide="download" class="w-4 h-4"></i></button>` : ''}
        <button class="del-btn text-slate-500 hover:text-red-400 transition" title="Deletar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>`;
    
    if (r.tem_comprovante) {
      el.querySelector('.down-btn').onclick = async () => { 
        await downloadComprovante(r.id, r.descricao); 
      };
    }
    
    el.querySelector('.del-btn').onclick = () => { 
      deleteTarget = r.id; 
      document.getElementById('delete-password').value = '';
      document.getElementById('delete-confirm').classList.remove('hidden'); 
    };
    
    list.appendChild(el);
  });
  
  lucide.createIcons();
  updateProgress();
}

async function downloadComprovante(recordId, descricao) {
  try {
    const comprovante = await getComprovante(recordId);
    if (!comprovante) {
      showToast('Comprovante não encontrado');
      return;
    }

    const fileNameBase = `Comprovante-${descricao || 'pagamento'}-${new Date().getTime()}`.replace(/[^a-zA-Z0-9-_\.]/g, '_');
    const blob = new Blob([comprovante.data], { type: comprovante.tipo });

    if (comprovante.tipo.includes('pdf')) {
      downloadBlob(blob, `${fileNameBase}.pdf`);
    } else {
      const pdfBlob = await convertImageBlobToPdf(blob, fileNameBase);
      downloadBlob(pdfBlob, `${fileNameBase}.pdf`);
    }

    showToast('Comprovante baixado!');
  } catch (e) {
    console.error('Erro ao baixar comprovante:', e);
    showToast('Erro ao baixar comprovante');
  }
}

function getExtensao(tipo) {
  if (tipo.includes('pdf')) return 'pdf';
  if (tipo.includes('jpeg') || tipo.includes('jpg')) return 'jpg';
  if (tipo.includes('png')) return 'png';
  if (tipo.includes('webp')) return 'webp';
  return 'bin';
}

function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function convertImageBlobToPdf(blob, title) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxWidth = 1400;
      const maxHeight = 1900;
      let width = img.width;
      let height = img.height;
      const ratio = Math.min(maxWidth / width, maxHeight / height, 1);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pdf = new window.jspdf.jsPDF({ orientation: width > height ? 'landscape' : 'portrait', unit: 'pt', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const scale = Math.min(pageWidth / width, pageHeight / height);
      const imgWidth = width * scale;
      const imgHeight = height * scale;
      const x = (pageWidth - imgWidth) / 2;
      const y = (pageHeight - imgHeight) / 2;
      pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight);
      resolve(pdf.output('blob'));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

async function getAllComprovantes() {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['comprovantes'], 'readonly');
    const store = transaction.objectStore('comprovantes');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function exportAllReceiptsPdf() {
  if (records.length === 0) {
    showToast('Nenhum pagamento para exportar');
    return;
  }
  const zip = new JSZip();
  for (const record of records) {
    if (!record.tem_comprovante) continue;
    const comprovante = await getComprovante(record.id);
    if (!comprovante) continue;
    const fileNameBase = `Comprovante-${record.descricao || 'pagamento'}-${record.id}`.replace(/[^a-zA-Z0-9-_\.]/g, '_');
    if (comprovante.tipo.includes('pdf')) {
      zip.file(`${fileNameBase}.pdf`, comprovante.data);
    } else {
      const blob = new Blob([comprovante.data], { type: comprovante.tipo });
      const pdfBlob = await convertImageBlobToPdf(blob, fileNameBase);
      zip.file(`${fileNameBase}.pdf`, await pdfBlob.arrayBuffer());
    }
  }

  const content = await zip.generateAsync({ type: 'blob' });
  downloadBlob(content, `comprovantes-todos-${new Date().toISOString().slice(0, 10)}.zip`);
  showToast('Exportação concluída!');
}

async function exportBackup() {
  const comprovantes = await getAllComprovantes();
  const backupRecords = [];
  for (const record of records) {
    const entry = { ...record };
    if (record.tem_comprovante) {
      const comprovante = comprovantes.find(c => c.id === record.id);
      if (comprovante) {
        const base64 = btoa(String.fromCharCode(...new Uint8Array(comprovante.data)));
        entry.comprovante = {
          name: comprovante.nome,
          type: comprovante.tipo,
          base64
        };
      }
    }
    backupRecords.push(entry);
  }
  const blob = new Blob([JSON.stringify({ records: backupRecords }, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `controle-de-entrada-backup-${new Date().toISOString().slice(0, 10)}.json`);
  showToast('Backup exportado!');
}

function normalizeGistId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  const parts = trimmed.match(/([0-9a-f]{32,})$/i);
  return parts ? parts[1] : null;
}

async function uploadBackupToGithub() {
  const token = prompt('Cole seu token GitHub com escopo de Gist (não será salvo):');
  if (!token) {
    showToast('Upload cancelado');
    return;
  }

  const comprovantes = await getAllComprovantes();
  const backupRecords = records.map((record) => {
    const entry = { ...record };
    if (record.tem_comprovante) {
      const comprovante = comprovantes.find(c => c.id === record.id);
      if (comprovante) {
        entry.comprovante = {
          name: comprovante.nome,
          type: comprovante.tipo,
          base64: btoa(String.fromCharCode(...new Uint8Array(comprovante.data)))
        };
      }
    }
    return entry;
  });

  const content = JSON.stringify({ records: backupRecords }, null, 2);
  const body = {
    description: 'Backup Controle de Entrada',
    public: false,
    files: {
      'controle-de-entrada-backup.json': { content }
    }
  };

  try {
    const response = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github+json'
      },
      body: JSON.stringify(body)
    });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(`GitHub API falhou: ${response.status} ${text}`);
    }

    const result = await response.json();
    window.open(result.html_url, '_blank');
    showToast('Backup enviado ao GitHub! Abra o Gist para copiar o link.');
  } catch (err) {
    console.error('Erro ao publicar backup no GitHub:', err);
    showToast('Falha ao salvar no GitHub');
  }
}

async function importBackupFromGithub() {
  const input = prompt('Cole o ID ou URL do Gist que contém o backup:');
  const gistId = normalizeGistId(input);
  if (!gistId) {
    showToast('ID de Gist inválido');
    return;
  }

  try {
    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (!response.ok) {
      throw new Error(`Gist não encontrado: ${response.status}`);
    }
    const gist = await response.json();
    const file = gist.files['controle-de-entrada-backup.json'] || Object.values(gist.files)[0];
    if (!file || !file.content) {
      showToast('Backup não encontrado no Gist');
      return;
    }

    const blob = new Blob([file.content], { type: 'application/json' });
    await importBackupFile(new File([blob], 'controle-de-entrada-backup.json', { type: 'application/json' }));
  } catch (err) {
    console.error('Erro ao carregar backup do GitHub:', err);
    showToast('Falha ao carregar do GitHub');
  }
}

async function importBackupFile(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.records || !Array.isArray(data.records)) {
      showToast('Backup inválido');
      return;
    }
    const existingIds = new Set(records.map(r => r.id));
    for (const entry of data.records) {
      if (!entry.id || existingIds.has(entry.id)) continue;
      records.push({
        id: entry.id,
        valor: entry.valor || 0,
        descricao: entry.descricao || 'Pagamento',
        data: entry.data || new Date().toISOString(),
        tem_comprovante: !!entry.tem_comprovante
      });
      if (entry.tem_comprovante && entry.comprovante && entry.comprovante.base64) {
        const arrayBuffer = base64ToArrayBuffer(entry.comprovante.base64);
        const fileBlob = new File([arrayBuffer], entry.comprovante.name || `comprovante-${entry.id}`, { type: entry.comprovante.type || 'application/octet-stream' });
        await saveComprovante(entry.id, fileBlob);
      }
    }
    saveRecords();
    renderRecords();
    showToast('Backup importado!');
  } catch (err) {
    console.error('Erro ao importar backup:', err);
    showToast('Falha ao importar backup');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.querySelector('div').textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

// UI Events
document.getElementById('btn-add').onclick = () => document.getElementById('modal').classList.remove('hidden');
document.getElementById('btn-close-modal').onclick = () => { 
  document.getElementById('modal').classList.add('hidden'); 
  resetForm(); 
};
document.getElementById('modal').onclick = (e) => { 
  if (e.target === e.currentTarget) { 
    document.getElementById('modal').classList.add('hidden'); 
    resetForm(); 
  } 
};

document.getElementById('input-camera').onchange = (e) => { 
  if (e.target.files[0]) { 
    hasFile = true; 
    document.getElementById('file-name').textContent = '📷 ' + e.target.files[0].name; 
    document.getElementById('file-name').classList.remove('hidden'); 
  } 
};

document.getElementById('input-file').onchange = (e) => { 
  if (e.target.files[0]) { 
    hasFile = true; 
    document.getElementById('file-name').textContent = '📎 ' + e.target.files[0].name; 
    document.getElementById('file-name').classList.remove('hidden'); 
  } 
};

document.getElementById('payment-form').onsubmit = async (e) => {
  e.preventDefault();
  const valor = parseFloat(document.getElementById('input-valor').value);
  if (!valor || valor <= 0) { 
    showToast('Valor inválido'); 
    return; 
  }
  if (records.length >= 999) { 
    showToast('Limite de registros atingido!'); 
    return; 
  }
  
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; 
  btn.innerHTML = '<i data-lucide="spinner" class="w-5 h-5 animate-spin"></i> Salvando...';
  
  try {
    const recordId = generateUUID();
    const novoRegistro = {
      id: recordId,
      valor,
      descricao: document.getElementById('input-desc').value || 'Pagamento',
      data: new Date().toISOString(),
      tem_comprovante: hasFile
    };
    
    // Salvar arquivo se houver
    if (hasFile) {
      const fileInput = document.getElementById('input-camera').files.length > 0 
        ? document.getElementById('input-camera') 
        : document.getElementById('input-file');
      
      const file = fileInput.files[0];
      await saveComprovante(recordId, file);
    }
    
    records.push(novoRegistro);
    records.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    saveRecords();
    renderRecords();
    
    showToast('Pagamento registrado!');
    document.getElementById('modal').classList.add('hidden');
    resetForm();
  } catch (err) {
    console.error('Erro ao salvar:', err);
    showToast('Erro ao salvar comprovante');
  }
  
  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> Salvar Pagamento';
  lucide.createIcons();
};

document.getElementById('btn-cancel-delete').onclick = () => { 
  deleteTarget = null; 
  document.getElementById('delete-confirm').classList.add('hidden'); 
};

document.getElementById('btn-export-pdfs').onclick = exportAllReceiptsPdf;
document.getElementById('btn-export-backup').onclick = exportBackup;
document.getElementById('btn-upload-github').onclick = uploadBackupToGithub;
document.getElementById('btn-load-github').onclick = importBackupFromGithub;
document.getElementById('btn-import-backup').onclick = () => document.getElementById('input-backup').click();
document.getElementById('input-backup').onchange = async (e) => {
  if (e.target.files[0]) {
    await importBackupFile(e.target.files[0]);
    e.target.value = '';
  }
};

document.getElementById('btn-confirm-delete').onclick = async () => {
  const senha = document.getElementById('delete-password').value;
  if (senha !== DELETE_PASSWORD) {
    showToast('Senha incorreta!');
    document.getElementById('delete-password').value = '';
    return;
  }
  
  if (deleteTarget === null) return;
  const btn = document.getElementById('btn-confirm-delete');
  btn.disabled = true; 
  btn.textContent = 'Excluindo...';
  
  try {
    // Encontrar o registro pelo ID
    const recordIndex = records.findIndex(r => r.id === deleteTarget);
    if (recordIndex === -1) return;
    
    // Deletar comprovante se houver
    if (records[recordIndex].tem_comprovante) {
      await deleteComprovante(deleteTarget);
    }
    
    // Remove do array
    records.splice(recordIndex, 1);
    saveRecords();
    renderRecords();
    
    showToast('Pagamento excluído.');
    document.getElementById('delete-confirm').classList.add('hidden');
  } catch (err) {
    console.error('Erro ao excluir:', err);
    showToast('Erro ao excluir');
  }
  
  btn.disabled = false; 
  btn.textContent = 'Excluir';
  deleteTarget = null;
};

function resetForm() {
  document.getElementById('payment-form').reset();
  hasFile = false;
  document.getElementById('file-name').classList.add('hidden');
}

// Inicializar ao carregar a página
document.addEventListener('DOMContentLoaded', async () => {
  try {
    await initIndexedDB();
  } catch (err) {
    console.error('Erro ao inicializar IndexedDB:', err);
    showToast('Aviso: Armazenamento local pode estar limitado');
  }
  
  records = loadRecords();
  renderRecords();
  lucide.createIcons();
});
  </script>
